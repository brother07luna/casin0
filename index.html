body{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    padding: 20px 0 40px 0;
    background-color: #000;

/* ========= VIDEO DE FONDO ========= */
.gif-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
}

body::before{
    content:"";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(3px);
    z-index: 1;
}

/* ========= CARTEL DE SORTEO DESTACADO ========= */
.promo-banner {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 450px;
    margin-bottom: 25px;
    padding: 18px 15px;
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 69, 0, 0.25));
    border: 2px solid #ffd700;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.4), inset 0 0 15px rgba(255, 215, 0, 0.2);
    text-align: center;
    animation: pulseGlow 2s infinite alternate;
}

.promo-tag {
    display: inline-block;
    background: #ff0055;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 50px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    box-shadow: 0 0 8px #ff0055;
}

.promo-title {
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    text-shadow: 0 0 10px #ffd700;
    margin-bottom: 5px;
}

.promo-monto {
    color: #ffd700;
    font-size: 28px;
    font-weight: 900;
    text-shadow: 0 0 15px #ff8c00;
    letter-spacing: 1px;
}

.promo-details {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed rgba(255, 255, 255, 0.2);
    display: flex;
    justify-content: space-around;
    font-size: 13px;
    color: #fff;
}

.promo-details span {
    display: flex;
    align-items: center;
    gap: 4px;
}

@keyframes pulseGlow {
    0% {
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.4), inset 0 0 10px rgba(255, 215, 0, 0.2);
        transform: scale(1);
    }
    100% {
        box-shadow: 0 0 28px rgba(255, 215, 0, 0.7), inset 0 0 20px rgba(255, 215, 0, 0.4);
        transform: scale(1.01);
    }
}

/* ========= BOTONES Y CONTENIDO ========= */
.box{
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 450px;
    text-align: center;

h1{

.sub{
    color:#d9d9d9;

    font-size:19px;
    text-shadow:0 0 15px gold;

.links{
    display: flex;
    flex-direction: column;
    gap: 16px;

a{
    text-decoration: none;
    color: white;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 22px;
    padding: 20px;
    transition: 0.3s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

a:hover{
    transform: scale(1.03);
    background: rgba(255,215,0,0.12);
    border: 1px solid gold;
    box-shadow: 0 0 25px rgba(255,215,0,0.5);

.icon{

.titulo{

.desc{
