<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Contacto</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
    background:#000;
    color:white;
}

.box{
    width:100%;
    max-width:450px;
    text-align:center;
}

h1{
    font-size:38px;
    margin-bottom:10px;
    text-shadow:0 0 15px gold;
}

.sub{
    color:#ccc;
    margin-bottom:30px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:15px;
}

a{
    display:block;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;
    padding:20px;
    transition:0.3s;
    backdrop-filter:blur(8px);
}

a:hover{
    transform:scale(1.03);
    border-color:gold;
    background:rgba(255,215,0,0.12);
    box-shadow:0 0 20px rgba(255,215,0,0.35);
}

.icon{
    font-size:35px;
    margin-bottom:8px;
}

.titulo{
    font-size:20px;
    font-weight:bold;
    margin-bottom:5px;
}

.desc{
    color:#ccc;
    font-size:14px;
}

@media(max-width:600px){
    h1{
        font-size:32px;
    }

    a{
        padding:18px;
    }
}
</style>
</head>

<body>

<div class="box">

    <h1>👋 Mi Contacto</h1>

    <p class="sub">
        Elegí una opción
    </p>

    <div class="links">

        <!-- GUARDAR CONTACTO -->
        <a href="contacto.vcf" download>
            <div class="icon">📇</div>
            <div class="titulo">Guardar contacto</div>
            <div class="desc">
                Guardá mis datos en tu teléfono
            </div>
        </a>

        <!-- WHATSAPP -->
        <a href="https://wa.me/5491100000000?text=Hola%2C%20quiero%20ponerme%20en%20contacto"
           target="_blank"
           rel="noopener noreferrer">

            <div class="icon">💬</div>

            <div class="titulo">
                Hablar por WhatsApp
            </div>

            <div class="desc">
                Enviame un mensaje
            </div>

        </a>

        <!-- INSTAGRAM -->
        <a href="https://www.instagram.com/"
           target="_blank"
           rel="noopener noreferrer">

            <div class="icon">📸</div>

            <div class="titulo">
                Instagram
            </div>

            <div class="desc">
                Seguime en Instagram
            </div>

        </a>

    </div>

</div>

</body>
</html>
